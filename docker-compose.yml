# Flowise (Apache-2.0) per-client single-tenant VM — turnkey builder stack.
#   flowise -> the builder product UI (port 3000). Served on :443 by Caddy.
#   panel   -> CloudHosting setup panel (ai-panel, PRODUCT=flowise). REDUCED builder
#              surface: login-gated landing + "Open Flowise" + avots status. :8443.
#   caddy   -> ONE Let's Encrypt cert for ${PANEL_DOMAIN}, TWO sites:
#                :443  -> flowise:3000  (the product)   <- "Open Flowise" target
#                :8443 -> panel:8080    (our panel)     <- the panel is ALWAYS on 8443
#              + :80 for ACME HTTP-01.
#
# CONVENTION (all products): the panel is on :8443; the product's own UI is on :443
# (so the panel's openProductUrl = https://${PANEL_DOMAIN} points at the product).
#
# The client configures the LLM provider/key INSIDE Flowise's own UI (it's a builder);
# the panel only links into it. No host applier is needed (no product config is written
# by the panel). flowise per-VM secrets are auto-generated by firstboot.sh into .env.

x-restart: &restart unless-stopped

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  flowise:
    # PINNED — never use :latest. Re-verify before each bake:
    #   https://hub.docker.com/r/flowiseai/flowise/tags  (3.1.2 == latest as of 2026-06-05)
    image: flowiseai/flowise:3.1.2
    container_name: flowise
    restart: *restart
    environment:
      PORT: "3000"
      DATABASE_TYPE: sqlite
      DATABASE_PATH: /root/.flowise
      SECRETKEY_PATH: /root/.flowise
      BLOB_STORAGE_PATH: /root/.flowise/storage
      LOG_PATH: /root/.flowise/logs
      # The product UI is served on :443 of the shared hostname (panel owns :8443).
      APP_URL: "https://${PANEL_DOMAIN}"
      # Per-VM auth/crypto secrets — auto-generated by firstboot.sh into .env.
      FLOWISE_SECRETKEY_OVERWRITE: "${FLOWISE_SECRETKEY_OVERWRITE}"
      JWT_AUTH_TOKEN_SECRET: "${JWT_AUTH_TOKEN_SECRET}"
      JWT_REFRESH_TOKEN_SECRET: "${JWT_REFRESH_TOKEN_SECRET}"
      TOKEN_HASH_SECRET: "${TOKEN_HASH_SECRET}"
      EXPRESS_SESSION_SECRET: "${EXPRESS_SESSION_SECRET}"
      SECURE_COOKIES: "true"
      EXPIRE_AUTH_TOKENS_ON_RESTART: "true"
      # Hardening: keep the custom-tool NodeVM sandbox restrictive (CVE-2025-34267).
      ALLOW_BUILTIN_DEP: "false"
      NUMBER_OF_PROXIES: "1"
      TRUST_PROXY: "true"
      DISABLE_FLOWISE_TELEMETRY: "true"
    volumes:
      - flowise_data:/root/.flowise
    expose:
      - "3000"
    networks:
      - web
    security_opt:
      - no-new-privileges:true
    logging: *logging
    # No docker.sock anywhere — the product runtime must never reach the host daemon.

  panel:
    image: ghcr.io/cloudhostinglv/ai-panel:latest
    container_name: flowise-panel
    restart: *restart
    user: "1000:1000"            # node user; firstboot chowns ./paneldata to 1000
    depends_on:
      - flowise
    environment:
      PRODUCT: "flowise"
      PANEL_PASSWORD: "${PANEL_PASSWORD}"      # REQUIRED; fails closed if empty
      PANEL_REQUIRE_AUTH: "1"
      PANEL_PORT: "8080"
      PANEL_DOMAIN: "${PANEL_DOMAIN}"          # builder openProductUrl = https://${PANEL_DOMAIN}
      AVOTS_API_KEY: "${AVOTS_API_KEY:-}"      # only drives the "connected" indicator (builder stub)
      HOME: "/paneldata"                       # persist session.key + brand.json across restarts
    volumes:
      - ./paneldata:/paneldata
    expose:
      - "8080"
    networks:
      - web
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *logging

  caddy:
    image: caddy:2.8-alpine
    container_name: flowise-caddy
    restart: *restart
    depends_on:
      - flowise
      - panel
    environment:
      PANEL_DOMAIN: "${PANEL_DOMAIN}"
    ports:
      - "80:80"                                # ACME HTTP-01
      - "443:443"                              # the product (Flowise)
      - "8443:8443"                            # the panel
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging: *logging

networks:
  web:
    driver: bridge

volumes:
  flowise_data:
  caddy_data:
  caddy_config:
