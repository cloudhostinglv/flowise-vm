# Flowise (Apache-2.0) per-client single-tenant VM — vanilla product, no extra panel.
#
# Decision (2026-06-07): builders run their OWN standard UI on their OWN standard port,
# WITHOUT the CloudHosting panel/Caddy layer. The customer reaches Flowise directly:
#   http://<vps-host>:3000   (Flowise's built-in UI handles its own account/login)
# Flowise configures its LLM provider/keys inside its own UI (avots = an OpenAI-compatible
# provider: pick "OpenAI", Base URL https://api.avots.ai/openai/v1, your avots key).
#
# NOTE: served over plain HTTP on :3000 (no TLS here, by design — "standard ports").
# SECURE_COOKIES is therefore false (a Secure cookie would be dropped over HTTP and
# break login). Put a TLS terminator in front if you want HTTPS.

x-restart: &restart unless-stopped

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  flowise:
    # PINNED — never use :latest. Re-verify before each bake:
    #   https://hub.docker.com/r/flowiseai/flowise/tags  (3.1.2 == latest as of 2026-06-05)
    image: flowiseai/flowise:3.1.2
    container_name: flowise
    restart: *restart
    environment:
      PORT: "3000"
      DATABASE_TYPE: sqlite
      DATABASE_PATH: /root/.flowise
      SECRETKEY_PATH: /root/.flowise
      BLOB_STORAGE_PATH: /root/.flowise/storage
      LOG_PATH: /root/.flowise/logs
      # Per-VM auth/crypto secrets — auto-generated by firstboot.sh into .env.
      FLOWISE_SECRETKEY_OVERWRITE: "${FLOWISE_SECRETKEY_OVERWRITE}"
      JWT_AUTH_TOKEN_SECRET: "${JWT_AUTH_TOKEN_SECRET}"
      JWT_REFRESH_TOKEN_SECRET: "${JWT_REFRESH_TOKEN_SECRET}"
      TOKEN_HASH_SECRET: "${TOKEN_HASH_SECRET}"
      EXPRESS_SESSION_SECRET: "${EXPRESS_SESSION_SECRET}"
      # Plain HTTP on :3000 -> Secure cookies would never be sent. Keep false unless
      # you front this with TLS (then set true).
      SECURE_COOKIES: "false"
      EXPIRE_AUTH_TOKENS_ON_RESTART: "true"
      # Hardening: keep the custom-tool NodeVM sandbox restrictive (CVE-2025-34267).
      ALLOW_BUILTIN_DEP: "false"
      DISABLE_FLOWISE_TELEMETRY: "true"
    volumes:
      - flowise_data:/root/.flowise
    ports:
      - "3000:3000"           # the product's own standard port (no Caddy / no :443 remap)
    security_opt:
      - no-new-privileges:true
    logging: *logging
    # No docker.sock anywhere — the product runtime must never reach the host daemon.

volumes:
  flowise_data:
