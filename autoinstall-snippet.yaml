# autoinstall-snippet.yaml — drop-in for the client's Ubuntu 24.04 autoinstall.
#
# Brings up vanilla Flowise (product only, no CloudHosting panel/Caddy) for ONE client
# on first boot. Clones the checkout + installs a first-boot oneshot; the actual
# `docker compose up` (and per-VM secret generation) runs in firstboot.sh.
#
# No panel password / domain needed: Flowise serves its own UI on http://<host>:3000
# and handles its own account/login. The LLM provider/key is set by the client INSIDE
# Flowise (avots = an OpenAI-compatible provider: Base URL https://api.avots.ai/openai/v1).

autoinstall:
  version: 1

  packages:
    - git
    - docker.io
    - docker-compose-v2
    - ca-certificates

  late-commands:
    - ["curtin", "in-target", "--", "bash", "-c", "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git docker.io docker-compose-v2 ca-certificates"]
    - ["curtin", "in-target", "--", "bash", "-c", "test -d /opt/flowise-vm || git clone --depth 1 https://github.com/cloudhostinglv/flowise-vm.git /opt/flowise-vm"]
    - ["curtin", "in-target", "--", "chmod", "0755", "/opt/flowise-vm/firstboot.sh"]
    - ["curtin", "in-target", "--", "cp", "/opt/flowise-vm/flowise-firstboot.service", "/etc/systemd/system/flowise-firstboot.service"]
    - ["curtin", "in-target", "--", "systemctl", "enable", "flowise-firstboot.service"]
